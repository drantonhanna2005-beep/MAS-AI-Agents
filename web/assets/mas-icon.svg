<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">MAS AI Agents</title>
  <defs>
    <radialGradient id="bg" cx="34%" cy="24%" r="82%">
      <stop offset="0" stop-color="#1d4694"/>
      <stop offset=".55" stop-color="#0c2254"/>
      <stop offset="1" stop-color="#061127"/>
    </radialGradient>
    <linearGradient id="gold" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#fff0b8"/>
      <stop offset=".38" stop-color="#f4cf7a"/>
      <stop offset=".72" stop-color="#d9a63f"/>
      <stop offset="1" stop-color="#9b671c"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe8a1"/>
      <stop offset="1" stop-color="#c58e2b"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fe6ff"/>
      <stop offset="1" stop-color="#2b8fff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="30.2" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="29.1" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="25.6" fill="none" stroke="#4f8fe8" stroke-opacity=".38" stroke-width=".8"/>

  <!-- circuit arc: artificial intelligence, kept subtle at 32px -->
  <g stroke="url(#cyan)" stroke-width=".9" fill="none" opacity=".82" filter="url(#glow)">
    <path d="M17 18.5h4.2l2.3 2.3v4.4"/>
    <path d="M14.5 24.5h4.8"/>
    <path d="M18.2 30.2h4.6"/>
    <path d="M45.8 18.8h-3.4l-2.2 2.2v3.9"/>
    <path d="M49.2 25h-4.4"/>
    <path d="M46.2 31.4h-4.7"/>
    <path d="M47.4 38.2h-4.9l-1.9-1.9"/>
    <path d="M18.8 38.4h4.4l1.6-1.6"/>
  </g>
  <g fill="url(#cyan)" filter="url(#glow)">
    <circle cx="13.9" cy="24.5" r="1"/><circle cx="17.7" cy="30.4" r=".9"/>
    <circle cx="49.7" cy="25" r="1"/><circle cx="46.6" cy="31.5" r=".9"/>
    <circle cx="47.9" cy="38.2" r=".9"/><circle cx="18.4" cy="38.5" r=".9"/>
    <circle cx="16.8" cy="18.3" r=".85"/><circle cx="46.2" cy="18.5" r=".85"/>
  </g>

  <!-- Sphinx head: gold nemes, calm profile, clean silhouette -->
  <g>
    <path d="M20.6 50.2 18.2 29.7c-.6-7 3.5-13 10.5-14.6l10.2-2.3c6.3-1.4 11 2.6 10.4 8.9l-1.6 17.9c-.2 2.4-1.4 4.3-3.6 5.5l-8.2 4.4-7.4.7z"
          fill="url(#gold)" stroke="#8a5b18" stroke-width=".7"/>
    <!-- nemes folds -->
    <g stroke="#8c5d1b" stroke-width=".85" stroke-linecap="round" opacity=".72">
      <path d="M21.7 26.2 36 22.4"/><path d="M21.3 30.2 37.5 26.2"/>
      <path d="M21.1 34.3 38.9 30.2"/><path d="M21.2 38.4 40.2 34.4"/>
      <path d="M21.5 42.4 41.3 38.5"/><path d="M22.3 46.3 40.7 43.2"/>
      <path d="M34.6 16.7 33.6 23"/><path d="M39.2 15.8 38.2 22.1"/>
    </g>
    <!-- side lappet -->
    <path d="M22.2 34.5c-2.9 3.3-3.2 8.8-.4 12.4l4.8-1.1-1.1-10.7z" fill="url(#gold2)" opacity=".96"/>
    <!-- face -->
    <path d="M35.2 23.1c3.7-.1 6.4 2.2 6.9 5.6l1.4 4.7c.2.9-.3 1.6-1.2 1.6h-1.5l.1 4.5c0 3.1-2.2 5.4-5.3 5.4l-2.9-.1.1-13.8c0-3.8 1-6.1 2.4-7.9z"
          fill="#f6d489" stroke="#a97622" stroke-width=".6"/>
    <!-- brow + eye -->
    <path d="M36.4 29.2c1.3-.9 3-.8 4.3-.1" fill="none" stroke="#7b4e13" stroke-width="1" stroke-linecap="round"/>
    <path d="M37.3 30.6c.9-.5 2-.4 2.8.1-.5 1.2-2.4 1.3-2.8-.1z" fill="#5a3a0e"/>
    <path d="M41.1 31.6c.8.4 1.5.5 2.3.4" fill="none" stroke="#a97622" stroke-width=".8" stroke-linecap="round"/>
    <!-- nose / lips / chin -->
    <path d="M43.4 33.4c.5.9.5 1.7-.1 2.3" fill="none" stroke="#a97622" stroke-width=".9" stroke-linecap="round"/>
    <path d="M40 38.1c1.1-.4 2.3-.4 3.4 0" fill="none" stroke="#8a5b18" stroke-width=".9" stroke-linecap="round"/>
    <path d="M38.8 40.2c1 .6 2.4.7 3.6.2" fill="none" stroke="#8a5b18" stroke-width=".8" stroke-linecap="round"/>
    <!-- uraeus accent -->
    <path d="M35.8 18.9c.8-2.1 2.7-2.8 4.2-1.6 1.2.9 1.1 2.5.1 3.4-.7.6-1.7.7-2.5.3" fill="url(#gold2)" stroke="#8a5b18" stroke-width=".5"/>
  </g>

  <!-- AI core -->
  <g>
    <circle cx="48.1" cy="42.8" r="6.6" fill="#081a38" stroke="url(#gold)" stroke-width="1"/>
    <text x="48.1" y="45.4" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
          font-size="5.6" font-weight="800" fill="url(#cyan)" letter-spacing=".2">AI</text>
  </g>
</svg>
